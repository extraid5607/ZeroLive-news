databases:
  - name: news-db
    databaseName: financenews
    user: newsuser
    plan: free

services:
  # 1. Web Server Service (FastAPI + Static Frontend)
  - type: web
    name: dalal-street-pulse-web
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: news-db
          property: connectionString
      - key: PORT
        value: 10000

  # 2. Hourly Automated News Ingestion Cron Job
  - type: cron
    name: dalal-street-pulse-fetcher
    env: python
    plan: free
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python fetch_news.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: news-db
          property: connectionString
